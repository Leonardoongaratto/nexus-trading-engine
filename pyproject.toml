[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-trading-engine"
version = "0.1.0"
description = "High-performance multi-asset algorithmic trading engine with institutional risk management and MetaTrader 5 execution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
nexus-engine = "xau_bot.cli.main:main"
xau-bot = "xau_bot.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xau_bot"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest_tmp --cov=src --cov-branch --cov-fail-under=80 --cov-report=term-missing"
